# test.yml — CI gate, MANUAL DISPATCH ONLY (coordination decision of
# 2026-10-04). This workflow no longer runs on push or pull_request: it is
# heavy (full documented suite + chaos failure-injection on ubuntu runners)
# and is now fired on demand with `gh workflow run test [--ref <branch>]`.
# Do NOT restore the old `push:`/`pull_request:` triggers; see the
# coordination notice in AGENTS.md at the repo root. The job body below is
# unchanged and still runs the FULL documented suite (docs/BUILD.md §4)
# plus the chaos suite:
#   * make test  — go unit tests, the 4 headless SPA tests, the curl E2E and
#     the Pi hardening structure test (rootless, artifact-level);
#   * make chaos — the failure-injection harness of tests/chaos/FAILURE_MATRIX.md.
#     The chaos scripts are Linux-first for exactly this job: on the ubuntu
#     runner every injection runs, including the full-disk one (sudo loop
#     mount is available); a host without volume tooling would SKIP that
#     injection instead of failing.
# Lint gates (gofmt/go vet, docs/BUILD.md §4) run as their own fast step.
#
# The `firmware` job (issue #39) cross-compiles the ESP32 firmware in the
# official espressif/idf container — both targets (esp32s3 reference,
# esp32 minimum) — and produces the merged flashable image per target. It
# runs in this same manual-dispatch workflow BY DECISION: the coordination
# notice in AGENTS.md forbids restoring push/pull_request triggers, so the
# "firmware compiles before merge" gate is exercised by dispatching this
# workflow on the branch before opening/merging the PR.
name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The espressif/idf image carries the full v5.5 toolchain; the export
      # sourcing gives the shell the idf.py environment. Both targets build
      # into separate build dirs (per-target sdkconfig/partitions), then
      # esptool merges each into one flashable image at the documented
      # offsets (docs/esp32-design.md §2, §5).
      - name: Build firmware (esp32s3 + esp32) and merge flashable images
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo espressif/idf:v5.5 bash -lc '
            set -euo pipefail
            . "$IDF_PATH/export.sh" >/dev/null
            cd esp32
            idf.py -DIDF_TARGET=esp32s3 -B build-esp32s3 -DSDKCONFIG=sdkconfig.esp32s3 build
            idf.py -DIDF_TARGET=esp32 -B build-esp32 -DSDKCONFIG=sdkconfig.esp32 build
            (cd build-esp32s3 && python "$IDF_PATH/components/esptool_py/esptool/esptool.py" \
              --chip esp32s3 merge_bin -o ../dtn-node-esp32s3.bin @flash_args)
            (cd build-esp32 && python "$IDF_PATH/components/esptool_py/esptool/esptool.py" \
              --chip esp32 merge_bin -o ../dtn-node-esp32.bin @flash_args)
            ls -l dtn-node-*.bin
          '

      - name: Upload merged firmware images
        uses: actions/upload-artifact@v4
        with:
          name: dtn-node-esp32-firmware
          path: |
            esp32/dtn-node-esp32s3.bin
            esp32/dtn-node-esp32.bin
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain versions follow the repo's documented pins (docs/BUILD.md
      # §1): Go from node/go.mod, Node 22 for the headless SPA tests.
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The E2E (§15.7 a/b fixtures) and the chaos corrupt/janitor scripts
      # need the sqlite3 CLI; install it only if the runner image lacks it.
      - name: Ensure sqlite3 CLI
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi

      - name: Lint gates (gofmt, go vet)
        run: |
          cd node
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Full suite (go test + SPA tests + E2E + hardening)
        run: make test

      - name: "Chaos suite (failure injection: kill/corrupt/full-disk/restart/flood/fuzz)"
        run: make chaos
