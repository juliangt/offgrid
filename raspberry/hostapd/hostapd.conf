# hostapd configuration — off-grid DTN dead-drop node (Module A)
# Install path: /etc/hostapd/hostapd.conf
#
# This file turns wlan0 into a STANDALONE open access point: no bridge, no
# uplink, no WPA. Clients reach only this node's captive portal
# (http://portal.red.local:8080, gateway 10.42.0.1). See docs/DEVELOPMENT_PLAN.md
# §1.6 (classic hostapd+dnsmasq stack, NetworkManager disabled) and §5 task 3.1.
#
# NOTE: this file replaces the distribution default in full; it does not
# include /etc/hostapd/hostapd.conf from any other file.

# The onboard wireless interface of the Pi Zero 2 W. provision.sh assigns this
# interface the static address 10.42.0.1/24 via ifupdown.
interface=wlan0

# nl80211 is the modern mac80211-based driver API; the Pi's brcmfmac chipset
# supports it (the legacy "hostap" driver API does not).
driver=nl80211

# Deliberately NO "bridge=" line: the AP is an isolated island with its own
# subnet (10.42.0.0/24). Bridging wlan0 into an Ethernet bridge would leak
# client traffic to any wired network and break the L2 isolation that
# ap_isolate=1 and the firewall's FORWARD DROP are here to guarantee.

# Network name shown to users. Must be identical on every node in the network
# so users can keep joining the same SSID as they move between portals.
ssid=Red-Comunitaria

# Regulatory domain. PLACEHOLDER: set per deployment region (AR by default,
# provision.sh overrides it from the COUNTRY environment variable). It must
# match the country where the node physically operates so hostapd picks legal
# channels and transmit power.
country_code=AR

# 802.11n (2.4 GHz HT) and WMM are required together: WMM (QoS) is mandatory
# for 802.11n to engage at all.
ieee80211n=1
wmm_enabled=1

# Fixed channel 6 (center of the 2.4 GHz band). Every node uses the SAME
# channel on purpose: nodes are deployed far apart (no co-channel interference
# in range of each other) and identical settings make each node
# indistinguishable from the client's point of view.
channel=6

# Open authentication (no WEP, no WPA). The AP is intentionally open: the
# security model is end-to-end encryption in the client, not link-layer
# security (docs/protocol.md §12). auth_algs=1 = open system.
auth_algs=1

# wpa=0 explicitly disables WPA/WPA2/WPA3. Do NOT add wpa_passphrase or
# wpa_key_mgmt: an open portal must be joinable without credentials so the
# captive-portal detection flow works on any device.
wpa=0

# Isolate associated clients from each other at layer 2: stations cannot send
# frames directly to one another. This is the first of two isolation layers —
# the firewall's empty FORWARD chain (policy DROP) reinforces it at layer 3.
ap_isolate=1

# Accept all MAC addresses; there is no allow/deny list. An open community
# portal cannot maintain per-device ACLs.
macaddr_acl=0

# Broadcast the SSID (do not hide it). A hidden SSID breaks captive-portal
# auto-detection and adds zero security on an open network.
ignore_broadcast_ssid=0

# ht_capab: 802.11n capability flags. The defaults (no options set) are safe
# for the Pi Zero 2 W's brcmfmac radio. If you need to tune them (e.g.
# [SHORT-GI-20] for short guard interval, [HT40-]/[HT40+] for 40 MHz
# channels), do it per deployment site after checking the radio's
# capabilities with "iw list" — do not copy flags blindly.
#ht_capab=[SHORT-GI-20][HT40+]
