# sshd drop-in — off-grid DTN dead-drop node (issue #16 Track 3)
# Repo path : raspberry/hardening/sshd-hardening.conf
# Installed : /etc/ssh/sshd_config.d/00-dtn-hardening.conf
#             by raspberry/hardening/harden-ssh.sh (validates with
#             "sshd -t" against the MERGED configuration before installing).
#
# PRECEDENCE (why a drop-in wins): Raspberry Pi OS Bookworm's stock
# /etc/ssh/sshd_config starts with "Include /etc/ssh/sshd_config.d/*.conf",
# and sshd applies the FIRST value it obtains for most keywords — so this
# file, included at the top of the parse (the 00- prefix also keeps it ahead
# of any other drop-in), overrides anything the main file sets later.
#
# STANCE (the node is an island — docs/protocol.md §12): SSH exists purely as
# the field operator's maintenance path; an AP client must never reach it
# (the phase-1 firewall drops client tcp/22 by default, iptables.sh
# "track3:ssh-never-reachable-from-clients"; ALLOW_SSH=1 re-opens it
# explicitly). Whoever CAN reach sshd gets key-only, rate-limited,
# forwarding-free access:
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
MaxStartups 3:30:10
LoginGraceTime 20
AllowAgentForwarding no
AllowTcpForwarding no
