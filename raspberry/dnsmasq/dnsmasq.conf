# dnsmasq configuration — off-grid DTN dead-drop node (Module A)
# Install path: /etc/dnsmasq.conf
#
# dnsmasq provides DHCP + DNS on the isolated AP subnet (10.42.0.0/24). The
# wildcard DNS record is what makes the captive portal work and what keeps
# every node identical in web origin: any hostname a client device looks up
# resolves to the gateway itself, where the dtn-node daemon answers
# (docs/protocol.md §12, docs/DEVELOPMENT_PLAN.md §1.1).
#
# This file replaces the distribution default in full. No conf-dir include is
# present on purpose: the node's DNS behavior must not be modified by dropped
# files in /etc/dnsmasq.d.

# Serve only the AP interface (wlan0). There is no uplink interface; the node
# itself must not answer DHCP/DNS queries on any other interface.
interface=wlan0

# Bind the listening socket strictly to wlan0's address instead of the
# wildcard address. Without it dnsmasq would process requests arriving on any
# local address (including lo), which breaks the interface-scoped stance.
bind-interfaces

# Do not read /etc/resolv.conf for upstream DNS servers. The node has no
# Internet uplink by design; there is no "upstream" to forward to, and
# reading resolv.conf would only produce useless/bogus servers.
no-resolv

# /etc/hosts stays ACTIVE (no "no-hosts" directive): the operator may add
# static local names for maintenance (e.g. mapping this node's serial or a
# short name) without touching this file.

# Reject A/AAAA queries for bare hostnames (no dots). Without a global DNS to
# resolve them they can only be junk; failing fast keeps logs clean.
domain-needed

# Never forward private-reverse lookups (10.in-addr.arpa, etc.) upstream.
# Defense in depth against leaking local queries if an upstream ever appears.
bogus-priv

# DHCP pool: 10.42.0.50–250 for 12 hours. The range deliberately avoids
# .1 (gateway/node), .2–.49 (reserved for operator static assignments) and
# .251–.254 (reserved). 12 h leases are long enough for typical dwell time at
# a portal and keep lease churn low.
dhcp-range=10.42.0.50,10.42.0.250,12h

# Option 3 (router): point clients at the node itself as their gateway. There
# is no other router; the firewall drops all forwarding anyway. Numeric option
# codes are used explicitly so the meaning survives dnsmasq version changes.
dhcp-option=3,10.42.0.1

# Option 6 (DNS server): the node is the only resolver, so every hostname the
# device tries to probe (connectivitycheck.gstatic.com, captive.apple.com,
# ...) lands on the node and triggers captive-portal detection.
dhcp-option=6,10.42.0.1

# Wildcard DNS: EVERY domain resolves to the node. This is the heart of the
# captive portal and of the same-origin trick — any URL a captive device
# tries to open ends up at the portal daemon.
address=/#/10.42.0.1

# Explicit canonical host record, belt-and-braces (docs/DEVELOPMENT_PLAN.md §1.1).
# "address=/" does not match some resolvers' edge cases (e.g. queries with
# empty/no domain handling); this guarantees offgrid.local always resolves
# to the node, which is the one origin shared by all nodes so IndexedDB never
# fragments between nodes.
address=/offgrid.local/10.42.0.1

# Be authoritative on this subnet: answer DHCP immediately without waiting to
# check for other DHCP servers (there are none, and a slow reboot must not
# wait for RFC 2131 collision checks).
dhcp-authoritative

# Debugging: uncomment to log every lease and every DNS query to the journal
# (then "journalctl -u dnsmasq"). Commented out by default: on a solar-powered
# node continuous logging costs power and SD-card writes.
#log-dhcp
#log-queries
